name: labxy
description: Laboratorio Flutter - clon de Netflix (LabFlix) con ListView, ListTile, Cards, rutas y tema global.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Imagenes locales
  assets:
    - assets/images/

  # 3 tipos de letra
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
